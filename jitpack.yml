jdk:
  - openjdk21

# JitPack's built-in Gradle runner fails to launch gradle-wrapper.jar
# ("An unexpected error occurred while trying to open file ..."), even though the
# checked-out jar is byte-identical to the one in git and passes `unzip -t`.
# Invoking ./gradlew ourselves from a custom install command works fine.
install:
  - ./gradlew -Pgroup=$GROUP -Pversion=$VERSION publishToMavenLocal --console=plain --no-configuration-cache
